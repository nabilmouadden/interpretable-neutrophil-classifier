# Test configuration: a tiny randomly initialised ViT that trains in seconds on CPU
# on the toy data from tests/toy_data.py. Only used by the end-to-end test.
base: ../configs/default.yaml

seed: 0

data:
  image_size: 64
  augmentation: none
  num_workers: 0

model:
  encoder: vit_small_patch16_224   # timm architecture name, randomly initialised
  pretrained: false
  encoder_kwargs: {embed_dim: 64, depth: 2, num_heads: 2}
  trainable_blocks: -1
  feature_dim: 32
  feature_heads: 2
  feature_mlp_hidden: 32

train:
  epochs: 40
  batch_size: 16
  lr_encoder: 1.0e-3
  lr_category_head: 3.0e-3
  lr_feature_head: 3.0e-3
  ema_decay: 0.99
  amp: false
  device: cpu

evaluation:
  n_bootstrap: 100
