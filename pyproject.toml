[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neutroclf"
version = "1.0.0"
description = "Interpretable and calibrated classifier for co-occurring neutrophil morphological abnormalities in peripheral blood smears"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nabil Mouadden" }]
requires-python = ">=3.10"
keywords = [
    "haematology",
    "cytomorphology",
    "neutrophils",
    "concept bottleneck",
    "calibration",
    "conformal prediction",
    "vision transformer",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "timm>=1.0",
    "huggingface_hub>=0.20",
    "safetensors>=0.4",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
neutroclf = "neutroclf.cli:main"

[project.urls]
Repository = "https://github.com/nabilmouadden/interpretable-neutrophil-classifier"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["B008", "E501"]  # line length is enforced by `ruff format`

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
